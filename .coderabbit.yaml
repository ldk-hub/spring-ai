language: "ko-KR"

reviews:
  profile: "professional"
  high_level_summary_instructions: |
    전문적이고 명확한 어조로 리뷰를 작성해 주세요. 단순한 띄어쓰기나 문법 지적보다는 아키텍처, 성능 향상, 유지보수성 관점에서의 개선안을 제안해 주시고, 건설적이고 실무적인 피드백을 우선시해 주세요. 
    이 PR의 핵심 변경 사항과 비즈니스 임팩트를 다른 팀원들이 한눈에 파악할 수 있도록 마크다운 글머리 기호로 간결하게 요약해 주세요.
  path_instructions:
    - path: "src/main/java/**/*.java"
      instructions: |
        - 시니어 백엔드 엔지니어 관점에서 깊이 있는 코드 리뷰를 진행해 주세요.
        - Spring Framework의 Best Practice(트랜잭션 관리, 의존성 주입, 예외 처리 등)를 준수하는지 확인해 주세요.
        - N+1 문제, 불필요한 DB 커넥션 점유 등 성능 저하를 유발할 수 있는 로직을 꼼꼼히 체크해 주세요.
        - Spring AI, Vector DB(pgvector 등)와 같은 외부 인프라 연동 로직에서는 타임아웃 설정과 예외 복구 로직이 안전하게 구현되었는지 검토해 주세요.
